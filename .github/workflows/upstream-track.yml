name: Upstream track

# Dual-track drift monitor against genspark-ai/genoffice:
#   Track 1 (Core Conflict Guard): runs `git merge-tree --write-tree` filtered
#     against the 15 synced engine/converter/shared packages. Any conflict fails
#     the job and opens/comments on the tracking issue.
#   Track 2 (Filtered Non-Core Drift Digest): writes an informational Markdown
#     summary to $GITHUB_STEP_SUMMARY excluding permanently skipped Desktop OS,
#     fork-only packages/scripts, and excluded tr/hu locales.

on:
  schedule:
    # 03:43 UTC daily — GitHub cron is UTC, off the top-of-the-hour stampede
    - cron: '43 3 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-track
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  merge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch upstream
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/genspark-ai/genoffice.git
          else
            git remote add upstream https://github.com/genspark-ai/genoffice.git
          fi
          git fetch upstream main

      # Run dual-track drift governance check. Writes the Markdown summary to
      # $GITHUB_STEP_SUMMARY and exits 1 only when Track 1 protected packages
      # have merge conflicts (exit 0 when Track 1 is clean even if Track 2 has
      # informational drift).
      - name: Dual-track upstream drift check
        id: drift
        run: |
          status=0
          output=$(node tools/upstream-drift-check.mjs --base HEAD --upstream upstream/main 2>&1) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 1 ]; then
            {
              echo 'track1_conflict=true'
              echo 'report<<DRIFT_REPORT_EOF'
              printf '%s\n' "$output" | head -n 120
              echo 'DRIFT_REPORT_EOF'
            } >> "$GITHUB_OUTPUT"
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::error::upstream-drift-check.mjs failed with exit code $status"
            exit "$status"
          fi

      # Only open or comment on the tracking issue when Track 1 fails (exit 1),
      # avoiding daily noise from permanently skipped Desktop OS / locale files
      # or checkout/fetch flakes.
      - name: Open or update the conflict tracking issue
        if: failure() && steps.drift.outcome == 'failure' && steps.drift.outputs.track1_conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.drift.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="upstream merge conflict with genspark-ai/genoffice"
          body=$(printf 'Track 1 protected engine/converter/shared packages conflicted during trial merge of `upstream/main` into `HEAD`.\n\n%s\n\nRun: %s\n' "$REPORT" "$RUN_URL")
          existing=$(gh issue list --state open --search '"upstream merge conflict" in:title' --json number --limit 1 --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "commenting on existing issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            echo "creating a new issue"
            gh issue create --title "$title" --body "$body"
          fi
